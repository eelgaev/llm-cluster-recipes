name: qwen3-27b-legion
type: legion           # runtime; run-recipe.sh maps type + node arch -> image
cacheKey: qwen3.8-27B-q4-v1  # same weights and cache as ../qwen3.8-27B
vars:
  MODEL_NAME: unsloth/Qwen3.8-27B
  # Folder next to this one that holds the weights (the llama.cpp recipe's folder).
  WEIGHTS_FOLDER: qwen3.8-27B
  # GPUs to split the layers over; "auto" = every GPU the pod was given.
  GPUS: auto
  # Legion registers itself with REGISTER_URL (--registry-api); the entrypoint skips its POST.
  SELF_REGISTER: "true"
script: |
  #!/usr/bin/env bash
  set -euo pipefail

  # Files remain in the node-local /models cache across pod restarts. Downloads
  # resume through .part files and are renamed only after they complete.
  fetch_cached() {
    local source=$1 destination=$2 partial="${2}.part"
    if [ -s "$destination" ]; then
      echo "cache hit: $destination"
      return
    fi
    wget -c "$source" -O "$partial"
    mv "$partial" "$destination"
  }

  # Same weight files as the llama.cpp recipe, served from its folder.
  base="${RECIPE_BASE_URL%/}"
  weights="${base%/*}/$WEIGHTS_FOLDER"
  fetch_cached "$weights/Qwen3.8-27B-UD-Q4_K_XL.gguf" /models/model.gguf
  fetch_cached "$weights/mtp-Qwen3.8-27B-Q4_0.gguf" /models/mtp.gguf
  fetch_cached "$weights/mmproj-BF16.gguf" /models/mmproj.gguf

  gpus=$GPUS
  if [ "$gpus" = auto ]; then
    if [ -n "${CUDA_VISIBLE_DEVICES:-}" ]; then
      gpus=$(printf '%s' "$CUDA_VISIBLE_DEVICES" | tr ',' '\n' | grep -c .)
    else
      gpus=$(nvidia-smi -L 2>/dev/null | grep -c '^GPU ' || true)
    fi
  fi
  [ "${gpus:-0}" -ge 1 ] || { echo "recipe: no GPU visible" >&2; exit 1; }
  echo "recipe: legion $(cat /usr/local/share/legion-commit 2>/dev/null || echo unknown), $gpus GPU(s)"

  # Layers split over the GPUs (one pipeline stage each). 16 sequences of up to 262,144
  # tokens each, KV cache in q8_0 as the llama.cpp recipe; what does not fit in VRAM goes
  # to Legion's host KV tier. Legion renders the GGUF's own chat template and splits the
  # reasoning itself, so the llama.cpp recipe's template file is not used.
  # Legion registers itself with the router (--registry-api, again every 5 minutes so a
  # restarted router picks it up); the readiness probe's /certs/registered is touched when
  # its first registration succeeds. Its output goes through the watcher below while legion
  # stays the foreground process (it gets the pod's SIGTERM directly).
  registered_watch() {
    local line
    while IFS= read -r line; do
      printf '%s\n' "$line"
      case $line in
        *"registry: registered with the proxy"*) touch /certs/registered ;;
      esac
    done
  }
  exec > >(registered_watch) 2>&1
  exec legion serve \
      --host 0.0.0.0 --port "$PORT" \
      --api-key "$API_KEY" \
      --tls-cert "$TLS_CRT" --tls-key "$TLS_KEY" \
      --device cuda --gpus "$gpus" \
      --model /models/model.gguf --mmproj /models/mmproj.gguf \
      --served-model-name "$MODEL_NAME" \
      --max-seqs 16 --ctx-size 262144 \
      --cache-type-k q8_0 --cache-type-v q8_0 \
      --spec mtp --spec-draft /models/mtp.gguf --spec-k 3 --spec-draft-vocab 65536 \
      --default-temperature 1.0 --default-top-p 0.95 --default-top-k 20 --default-min-p 0.0 \
      --registry-api "$REGISTER_URL" --registry-host "$NODE_HOST_IP"
