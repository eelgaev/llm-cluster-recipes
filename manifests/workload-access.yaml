apiVersion: v1
kind: Namespace
metadata:
  name: llm-recipes
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: llm-recipe
  namespace: llm-recipes
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: llm-recipe-reconciler
  namespace: llm-recipes
---
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: llm-recipe-host-cache-llm-recipes
  annotations:
    kubernetes.io/description: Allows the llm-recipe workload to use host networking and its node-local model cache.
allowHostDirVolumePlugin: true
allowHostIPC: false
allowHostNetwork: true
allowHostPID: false
allowHostPorts: true
allowPrivilegeEscalation: false
allowPrivilegedContainer: false
allowedCapabilities: []
defaultAddCapabilities: []
fsGroup:
  type: RunAsAny
priority: 10
readOnlyRootFilesystem: false
requiredDropCapabilities:
  - ALL
runAsUser:
  type: RunAsAny
seLinuxContext:
  type: RunAsAny
seccompProfiles:
  - runtime/default
supplementalGroups:
  type: RunAsAny
users: []
groups: []
volumes:
  - configMap
  - downwardAPI
  - emptyDir
  - hostPath
  - projected
  - secret
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: llm-recipe-use-host-cache
  namespace: llm-recipes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:llm-recipe-host-cache-llm-recipes
subjects:
  - kind: ServiceAccount
    name: llm-recipe
    namespace: llm-recipes
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: llm-recipe-node-reader-llm-recipes
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: llm-recipe-node-reader-llm-recipes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: llm-recipe-node-reader-llm-recipes
subjects:
  - kind: ServiceAccount
    name: llm-recipe-reconciler
    namespace: llm-recipes
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: llm-recipe-daemonset-reconciler
  namespace: llm-recipes
rules:
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["get", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: llm-recipe-daemonset-reconciler
  namespace: llm-recipes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: llm-recipe-daemonset-reconciler
subjects:
  - kind: ServiceAccount
    name: llm-recipe-reconciler
    namespace: llm-recipes
