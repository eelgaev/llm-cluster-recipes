apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: llm-recipe-arch
  namespace: llm-recipes
  labels:
    app: llm-recipe
    recipe: recipe-placeholder
    arch: arch-placeholder
spec:
  selector:
    matchLabels:
      app: llm-recipe
      arch: arch-placeholder
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: llm-recipe
        recipe: recipe-placeholder
        arch: arch-placeholder
      annotations:
        llm-recipes.openai.com/script-checksum: checksum-placeholder
    spec:
      serviceAccountName: llm-recipe
      hostNetwork: true
      dnsPolicy: Default
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 0
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        feature.node.kubernetes.io/pci-10de.present: "true"
        kubernetes.io/arch: arch-placeholder
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      initContainers:
        - name: prepare-cache
          image: image-placeholder
          command:
            - /bin/bash
            - -ec
            - |
              chmod 0755 /models
              # hostPath volumes are not automatically relabeled by kubelet.
              if [ -e /sys/fs/selinux/enforce ]; then
                chcon -R -t container_file_t -l s0 /models
              fi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seLinuxOptions:
              type: spc_t
          volumeMounts:
            - name: models
              mountPath: /models
      containers:
        - name: llm
          image: image-placeholder
          imagePullPolicy: Always
          command: ["/bin/bash", "/runtime/entrypoint.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seLinuxOptions:
              type: container_t
          env:
            - name: RECIPE_BASE_URL
              value: https://recipe.invalid
            - name: PORT
              value: "52395"
            - name: REGISTER_URL
              value: https://register.invalid
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NODE_HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          ports:
            - name: https
              containerPort: 52395
              hostPort: 52395
              protocol: TCP
          startupProbe:
            exec:
              command:
                - /bin/bash
                - /runtime/healthcheck.sh
                - live
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 1440
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - /runtime/healthcheck.sh
                - ready
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["/bin/bash", "/runtime/healthcheck.sh", "live"]
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            limits:
              nvidia.com/gpu: "__GPU_COUNT__"
          volumeMounts:
            - name: runtime
              mountPath: /runtime
              readOnly: true
            - name: recipe
              mountPath: /recipe
            - name: models
              mountPath: /models
            - name: certs
              mountPath: /certs
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: runtime
          configMap:
            name: llm-recipe-runtime
        - name: recipe
          configMap:
            name: llm-recipe-script
            defaultMode: 0755
        - name: models
          hostPath:
            path: /var/cache/llm-cluster-recipes/models/recipe-placeholder
            type: DirectoryOrCreate
        - name: certs
          emptyDir: {}
        - name: shm
          emptyDir:
            medium: Memory
